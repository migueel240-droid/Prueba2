ont-weight:900;color:var(--navy)}.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:8;background:#ffffffef;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 22px #183b6509}.bottom-nav button{background:transparent;color:var(--muted);padding:6px 9px;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px}.bottom-nav button b{font-size:1.3rem}.bottom-nav button.active{color:var(--blue);background:#eaf3fd}.bottom-nav .navnew{background:var(--yellow);color:#183b65;border-radius:13px;padding:7px 12px}.hidden{display:none!important}.notice{padding:12px 14px;border-radius:13px;background:#fff6ca;color:#6b5500;font-size:.85rem;margin:10px 0;border:1px solid #f2df86;line-height:1.45}.empty{text-align:center;padding:28px 14px;color:var(--muted);background:#fff;border:1px dashed #cbd9e8;border-radius:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:11px 0}.toolbar>*{flex:1;min-width:max-content}.divider{height:1px;background:var(--line);margin:13px 0}.tablelike{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #edf1f6}.tablelike:last-child{border:0}.danger-text{color:var(--red)}.photo-preview{width:70px;height:70px;border-radius:14px;object-fit:cover;border:1px solid var(--line)}.inline-field{display:flex;gap:8px;align-items:center}.inline-field>*{flex:1;min-width:0}.tabs{display:flex;gap:8px;overflow:auto;margin:10px 0}.tabs button{white-space:nowrap;background:#eaf2fb;color:var(--blue);padding:9px 12px}.tabs button.active{background:var(--blue);color:#fff}.sale-row{transition:box-shadow .15s}.sale-row:hover{box-shadow:0 10px 28px #173d6418}h3{letter-spacing:-.015em}p{line-height:1.5}input[type=file]{font-size:.85rem}@media(min-width:600px){.container{padding-top:24px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.app-header{padding-left:24px;padding-right:24px}.bottom-nav{left:50%;right:auto;transform:translateX(-50%);width:min(100%,760px);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}}
